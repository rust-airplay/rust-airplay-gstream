name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      # The MSYS2 GStreamer libraries are MinGW builds, so the Windows job links with the
      # GNU Rust toolchain rather than the MSVC one the runner installs by default.
      - name: Prepare the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'
          if (-not $msys2) { $msys2 = 'C:\msys64' }
          $prefix = Join-Path $msys2 'ucrt64'
          $pkgconf = Join-Path $prefix 'bin\pkgconf.exe'
          if (-not (Test-Path $pkgconf)) {
              $pkgconf = Join-Path $prefix 'bin\pkg-config.exe'
          }
          if (-not (Test-Path $pkgconf)) {
              throw "pkg-config was not installed under $prefix"
          }
          (Join-Path $prefix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$pkgconf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$(Join-Path $prefix 'lib\pkgconfig')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Check pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --cflags glib-2.0

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Select the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run the tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
